services:
  # Matrix Homeserver — Tuwunel（Rust，替代 Synapse；数据不可与 Synapse 混用）
  # https://github.com/matrix-construct/tuwunel
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:v1.5.1
    container_name: clawteam-tuwunel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SYNAPSE_PORT:-8008}:8008"
    volumes:
      - ../volumes/tuwunel-data:/var/lib/tuwunel:rw
    networks:
      - clawteam-network
    env_file:
      - ../.env
    environment:
      TUWUNEL_SERVER_NAME: "${SYNAPSE_SERVER_NAME:-localhost}"
      TUWUNEL_DATABASE_PATH: "/var/lib/tuwunel"
      TUWUNEL_ADDRESS: '["0.0.0.0"]'
      TUWUNEL_PORT: "8008"
      TUWUNEL_ALLOW_REGISTRATION: "true"
      # 与 .env 中 SYNAPSE_REGISTRATION_SHARED_SECRET 对齐（脚本与注册均使用该口令）
      TUWUNEL_REGISTRATION_TOKEN: "${SYNAPSE_REGISTRATION_SHARED_SECRET:-a-secret-key-change-in-production}"
      TUWUNEL_ALLOW_FEDERATION: "${TUWUNEL_ALLOW_FEDERATION:-false}"
    # 官方 OCI 镜像无 curl；健康依赖 deploy.sh 宿主机探测；OpenClaw 自带重试。

  # OpenClaw (Gateway + agents; entrypoint 见 openclaw/openclaw-startup.sh)
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    image: clawteam-openclaw:latest
    container_name: clawteam-openclaw
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
    command: ["/bin/bash", "/app/openclaw/openclaw-startup.sh"]
    volumes:
      - ../openclaw/openclaw-startup.sh:/app/openclaw/openclaw-startup.sh:ro
      - ../.env:/app/.env:ro
      - ../config/openclaw:/app/.openclaw:ro
      - ../volumes/openclaw:/root/.openclaw:rw
      - ../platform/matrix-ensure-user.py:/app/platform/matrix-ensure-user.py:ro
    environment:
      OPENCLAW_HOST: "0.0.0.0"
      OPENCLAW_PORT: "18789"
      SYNAPSE_SERVER_NAME: "${SYNAPSE_SERVER_NAME:-localhost}"
      SYNAPSE_ENDPOINT: "http://tuwunel:8008"
      MATRIX_REGISTRATION_TOKEN: "${SYNAPSE_REGISTRATION_SHARED_SECRET:-a-secret-key-change-in-production}"
    networks:
      - clawteam-network
    depends_on:
      - tuwunel

networks:
  clawteam-network:
    driver: bridge
