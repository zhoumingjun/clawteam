# Synapse Homeserver Configuration for Claw Team
# Generated for MVP testing

# Server identity
server_name: "${SYNAPSE_SERVER_NAME:-localhost}"
server_notices_channel:
  enabled: false

# Database configuration
database:
  name: "sqlite3"
  args:
    database: "/data/homeserver.db"

# Event retention
retention:
  enabled: false

# Caching (more headroom for multiple clients / agents on one HS)
event_cache_size: "50K"
caches:
  global_factor: 1.2

# Listeners
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: false
    bind_addresses:
      - "0.0.0.0"
    resources:
      - compress: true
        names:
          - client
      - compress: false
        names:
          - federation

# Authentication
password_config:
  enabled: true
  pepper: ""

# Registration
enable_registration: true
enable_registration_without_verification: true
registration_shared_secret: "${SYNAPSE_REGISTRATION_SHARED_SECRET:-a-secret-key-change-in-production}"

# Metrics
enable_metrics: false
report_stats: false

# Rate limits — relaxed for local / trusted multi-agent use.
# Defaults (e.g. rc_message 0.2/s, burst 10) easily trigger M_LIMIT_EXCEEDED under bots.
# Do NOT use these values on a public-facing homeserver.
rc_message:
  per_second: 30
  burst_count: 200

rc_registration:
  per_second: 10
  burst_count: 50

rc_registration_token_validity:
  per_second: 5
  burst_count: 20

rc_login:
  address:
    per_second: 10
    burst_count: 100
  account:
    per_second: 10
    burst_count: 100
  failed_attempts:
    per_second: 5
    burst_count: 20

rc_joins:
  local:
    per_second: 5
    burst_count: 50
  remote:
    per_second: 2
    burst_count: 40

rc_joins_per_room:
  per_second: 10
  burst_count: 50

rc_invites:
  per_room:
    per_second: 5
    burst_count: 50
  per_user:
    per_second: 2
    burst_count: 30

rc_media_create:
  per_second: 50
  burst_count: 200

rc_3pid_validation:
  per_second: 1
  burst_count: 15

rc_federation:
  window_size: 1000
  sleep_limit: 40
  sleep_delay: 100
  reject_limit: 80
  concurrent: 10

# ACME (Let's Encrypt) for TLS certificates
acme:
  enabled: false

# Media
media_store_path: "/data/media_store"
max_upload_size: "10M"
max_image_payload_size: "10M"
dynamic_thumbnails: false

# URL previews
url_preview_enabled: false

# Room defaults
default_room_version: "11"
# Minimum room version that clients must support (set high for MVP simplicity)
# Clients using any version below this will be rejected
# minimum_core_definition_version: "11"
