version: '3.8'

services:
  todo-demo:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: clawteam-todo-demo
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  demo-network:
    driver: bridge
