services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: clawteam-synapse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - ./volumes/synapse-data:/data:rw
    networks:
      - clawteam-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  element:
    image: vectorim/element-web:latest
    container_name: clawteam-element
    restart: unless-stopped
    ports:
      - "127.0.0.1:10001:80"
    volumes:
      - ./configs/element/config.json:/usr/share/nginx/html/config.json:ro
    environment:
      - SERVER_NAME=${SYNAPSE_SERVER_NAME:-localhost}
      - ELEMENT_WEB_URL=http://localhost:${SYNAPSE_PORT:-8008}
    networks:
      - clawteam-network
    depends_on:
      - synapse

networks:
  clawteam-network:
    driver: bridge

volumes: {}
