services:
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: clawteam-synapse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - ./volumes/synapse-data:/data:rw
    networks:
      - clawteam-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/_matrix/client/versions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  element:
    image: vectorim/element-web:latest
    container_name: clawteam-element
    restart: unless-stopped
    ports:
      - "127.0.0.1:10001:80"
    volumes:
      - ./configs/element/config.json:/usr/share/nginx/html/config.json:ro
    environment:
      - SERVER_NAME=${SYNAPSE_SERVER_NAME:-localhost}
      - ELEMENT_WEB_URL=http://localhost:${SYNAPSE_PORT:-8008}
    networks:
      - clawteam-network
    depends_on:
      - synapse

  openclaw-agent-manager:
    image: ghcr.io/openclaw/openclaw:main-slim
    container_name: clawteam-openclaw-agent-manager
    restart: unless-stopped
    environment:
      - MATRIX_HOMESERVER=http://synapse:8008
      - AGENT_ID=${OPENCLAW_AGENT_ID:-manager}
      - AGENT_PASSWORD=${OPENCLAW_AGENT_PASSWORD}
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY}
      - OPENCLAW_MATRIX_HOMESERVER=http://synapse:8008
      - OPENCLAW_AGENT_ID=${OPENCLAW_AGENT_ID:-openclaw-agent}
      - OPENCLAW_AGENT_PASSWORD=${OPENCLAW_AGENT_PASSWORD}
    volumes:
      - ./configs/agents/manager:/app/agent:ro
      - ./volumes/openclaw-data:/home/node/.openclaw:rw
    networks:
      - clawteam-network
    depends_on:
      synapse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "openclaw", "gateway", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  openclaw-agent-dev:
