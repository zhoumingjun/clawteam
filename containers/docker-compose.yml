services:
  # Matrix Homeserver — Tuwunel (Rust)
  # https://github.com/matrix-construct/tuwunel
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:v1.5.1
    container_name: clawteam-tuwunel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MATRIX_PORT:-8008}:8008"
    volumes:
      - ../volumes/tuwunel-data:/var/lib/tuwunel:rw
    networks:
      - clawteam-network
    env_file:
      - ../.env
    environment:
      TUWUNEL_SERVER_NAME: "${MATRIX_SERVER_NAME:-localhost}"
      TUWUNEL_DATABASE_PATH: "/var/lib/tuwunel"
      TUWUNEL_ADDRESS: '["0.0.0.0"]'
      TUWUNEL_PORT: "8008"
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_REGISTRATION_TOKEN: "${MATRIX_REGISTRATION_TOKEN:-a-secret-key-change-in-production}"
      TUWUNEL_ALLOW_FEDERATION: "${TUWUNEL_ALLOW_FEDERATION:-false}"
    # Tuwunel 镜像无 shell，healthcheck 由 openclaw 的 wait_for_homeserver() 负责
    # healthcheck: 不适用（distroless 镜像）

  # OpenClaw (Gateway + agents)
  openclaw:
    build:
      context: openclaw
      dockerfile: Dockerfile
    image: clawteam-openclaw:latest
    container_name: clawteam-openclaw
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
    command: ["/bin/bash", "/app/openclaw/entrypoint.sh"]
    volumes:
      - ./openclaw/entrypoint.sh:/app/openclaw/entrypoint.sh:ro
      - ./openclaw/lib:/app/openclaw/lib:ro
      - ../.env:/app/.env:ro
      - ../config/agents:/app/.openclaw:ro
      - ../volumes/openclaw:/root/.openclaw:rw
    environment:
      OPENCLAW_HOST: "0.0.0.0"
      OPENCLAW_PORT: "18789"
      MATRIX_SERVER_NAME: "${MATRIX_SERVER_NAME:-localhost}"
      MATRIX_HOMESERVER_URL: "http://tuwunel:8008"
      MATRIX_REGISTRATION_TOKEN: "${MATRIX_REGISTRATION_TOKEN:-a-secret-key-change-in-production}"
    networks:
      - clawteam-network
    depends_on:
      - tuwunel

  # Dashboard (Next.js)
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: clawteam-dashboard:latest
    container_name: clawteam-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../volumes/openclaw:/data/openclaw:rw
    environment:
      OPENCLAW_DATA_DIR: /data/openclaw
    networks:
      - clawteam-network
    depends_on:
      - openclaw

networks:
  clawteam-network:
    driver: bridge
